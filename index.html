<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14120f"><title>Leo 曲目</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="songs.js" defer></script><script src="app.js" defer></script></head>
<body><main><header><h1>Leo 曲目</h1><div class="toolbar"><button id="edit" aria-pressed="false">編輯歌單</button><button id="export">匯出</button></div></header><p id="status" role="status" hidden></p><div id="editor" hidden><button id="add">新增歌曲</button><button id="reset">還原成預設歌單</button></div><div id="list"></div><footer>Leo · 歌單</footer></main>
<dialog id="dialog"><form id="form"><h2 id="form-title">新增歌曲</h2><label>歌名<input name="title" required maxlength="200"></label><label>歌手<input name="artist" maxlength="200"></label><label>備註<input name="note" maxlength="500"></label><label>分類<select name="category"><option value="personal">個人曲目</option><option value="group">團體曲目</option><option value="banned">禁歌</option></select></label><label class="checkbox"><input name="highlight" type="checkbox">重點歌</label><div class="toolbar"><button type="button" id="cancel">取消</button><button type="submit">儲存</button></div></form></dialog></body></html>
