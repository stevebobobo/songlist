<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14120f"><title>Leo 曲目</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="songs.js" defer></script><script src="app.js" defer></script></head>
<body><p id="status" role="status" hidden></p>
<main id="home"><header><h1>Leo 曲目</h1><div class="toolbar"><button id="edit" aria-pressed="false">編輯歌單</button><button id="export">匯出</button></div></header><div id="editor" hidden><button id="add">新增歌曲</button><button id="import">匯入</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="reset">還原成預設歌單</button></div><div id="list"></div><footer>Leo · 歌單</footer></main>
<article id="lyrics" hidden><nav class="toolbar"><a id="back" href="#">← 歌單</a><span class="spacer"></span><button id="smaller" aria-label="歌詞字縮小">A−</button><button id="larger" aria-label="歌詞字放大">A＋</button><button id="lyrics-edit">編輯歌詞</button></nav><h1 id="lyrics-title"></h1><p id="lyrics-meta" class="details note"></p><div id="lyrics-text"></div><div id="lyrics-empty"><p>這首歌還沒有歌詞。</p><a id="lyrics-search" target="_blank" rel="noopener">搜尋歌詞</a></div><form id="lyrics-form" hidden><label>歌詞（只存在這台裝置，不會上傳）<textarea name="text" rows="16"></textarea></label><div class="toolbar"><button type="button" id="lyrics-cancel">取消</button><button type="submit">儲存</button></div></form><nav class="toolbar pager"><button id="prev"></button><button id="next"></button></nav></article>
<dialog id="dialog"><form id="form"><h2 id="form-title">新增歌曲</h2><label>歌名<input name="title" required maxlength="200"></label><label>歌手<input name="artist" maxlength="200"></label><label>備註<input name="note" maxlength="500"></label><label>我的歌譜連結（例如雲端硬碟裡的歌譜檔）<input name="sheet" type="url" inputmode="url" maxlength="1000" placeholder="https://"></label><label>分類<select name="category"><option value="personal">個人曲目</option><option value="group">團體曲目</option><option value="banned">禁歌</option></select></label><label class="checkbox"><input name="highlight" type="checkbox">重點歌</label><div class="toolbar"><button type="button" id="cancel">取消</button><button type="submit">儲存</button></div></form></dialog></body></html>
